<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leave me a message</title>
  <style>
    :root {
      --bg-1: #0f1222;
      --bg-2: #1a1f3a;
      --card: #ffffff;
      --ink: #1c1d2b;
      --muted: #6b6f8a;
      --accent: #6c5ce7;
      --accent-2: #a29bfe;
      --ring: rgba(108, 92, 231, 0.25);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, var(--bg-2), var(--bg-1));
      color: var(--ink);
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border-radius: 20px;
      padding: 2.25rem 2rem 2rem;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.08);
    }
    .heading {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .heading .icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 0.75rem;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
    }
    .heading .icon svg { width: 26px; height: 26px; color: #fff; }
    .heading h1 {
      font-size: 1.3rem;
      margin: 0 0 0.25rem;
      letter-spacing: -0.01em;
    }
    .heading p {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    form { display: flex; flex-direction: column; gap: 1.1rem; }
    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .field input, .field textarea {
      width: 100%;
      font: inherit;
      padding: 0.75rem 0.9rem;
      border-radius: 10px;
      border: 1.5px solid #e4e4ef;
      background: #fafafe;
      color: var(--ink);
      resize: vertical;
      transition: border-color .15s, box-shadow .15s;
    }
    .field textarea { min-height: 90px; }
    .field input:focus, .field textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--ring);
      background: #fff;
    }
    .field .count {
      text-align: right;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }
    button[type="submit"] {
      margin-top: 0.3rem;
      border: 0;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      font: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      cursor: pointer;
      transition: transform .1s, box-shadow .15s, opacity .15s;
      box-shadow: 0 8px 20px -8px var(--ring);
    }
    button[type="submit"]:hover:not(:disabled) { transform: translateY(-1px); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
    #msg {
      min-height: 1.3em;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 0.9rem;
      border-radius: 8px;
      padding: 0;
      transition: padding .15s;
    }
    #msg.show { padding: 0.55rem; }
    #msg.ok { background: #eafaf0; color: #1b8a4d; }
    #msg.err { background: #fdecec; color: #c0392b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="heading">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <h1>Leave me a message</h1>
      <p>Tell me who you are and say hi 👋</p>
    </div>
    <form id="f">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required maxlength="100" placeholder="e.g. rahul_k">
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required maxlength="500" placeholder="Write a short message..."></textarea>
        <div class="count"><span id="charCount">0</span>/500</div>
      </div>
      <button type="submit" id="submitBtn">Send message</button>
      <div id="msg"></div>
    </form>
  </div>
  <script>
    const f = document.getElementById('f');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    const messageInput = document.getElementById('message');
    const charCount = document.getElementById('charCount');

    messageInput.addEventListener('input', () => {
      charCount.textContent = messageInput.value.length;
    });

    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msg.className = '';
      msg.textContent = '';
      try {
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: f.username.value, message: f.message.value })
        });
        const data = await res.json();
        msg.textContent = res.ok ? 'Sent! Thanks for the message 🎉' : (data.error || 'Something went wrong.');
        msg.className = 'show ' + (res.ok ? 'ok' : 'err');
        if (res.ok) { f.reset(); charCount.textContent = '0'; }
      } catch {
        msg.textContent = 'Network error. Try again.';
        msg.className = 'show err';
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
